[project]
name = "prompt-engineer-backend"
version = "0.4.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "sqlalchemy>=2,<3",
  "langgraph>=1,<2",
  "httpx>=0.28,<1",
  "cryptography>=46,<47",
  "python-dotenv>=1,<2",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
