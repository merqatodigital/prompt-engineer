services:
  backend:
    image: python:3.12-slim
    working_dir: /app/backend
    volumes: ["./backend:/app/backend"]
    env_file: .env
    command: sh -c "pip install -e . && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports: ["8000:8000"]
  frontend:
    image: node:24-alpine
    working_dir: /app/frontend
    volumes: ["./frontend:/app/frontend"]
    env_file: .env
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0"
    ports: ["3000:3000"]
    depends_on: [backend]

